name: Dependency Review

# actions/dependency-review-action needs the repository's Dependency Graph
# (Settings → Code security → Dependency graph). It is enabled for this
# repository, so the step is a hard gate: a vulnerable dependency change fails CI.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

name: Dependency Review

# actions/dependency-review-action needs the repository's Dependency Graph
# (Settings → Code security → Dependency graph). It is enabled for this
# repository, so the step is a hard gate: a vulnerable dependency change fails CI.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
